<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Potassium Study Quiz</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172238;
      background: #f3f6fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    main {
      width: min(100%, 34rem);
      background: white;
      border: 1px solid #dce4ef;
      border-radius: 1rem;
      padding: clamp(1.25rem, 5vw, 2rem);
      box-shadow: 0 12px 36px rgba(30, 55, 90, .09);
    }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.45rem, 5vw, 1.9rem); }
    .intro { margin: 0 0 1.5rem; color: #526078; line-height: 1.5; }
    .count { color: #526078; font-size: .9rem; margin-bottom: .65rem; }
    .question { font-size: 1.15rem; line-height: 1.5; margin: 0 0 1rem; }
    .choices { display: grid; gap: .7rem; }
    button {
      font: inherit;
      cursor: pointer;
      border-radius: .7rem;
      min-height: 3rem;
    }
    .choice {
      text-align: left;
      padding: .8rem 1rem;
      color: #172238;
      background: #fff;
      border: 2px solid #cbd5e1;
    }
    .choice:hover:not(:disabled), .choice:focus-visible {
      border-color: #315bc5;
      outline: 3px solid rgba(49, 91, 197, .18);
    }
    .choice:disabled { cursor: default; opacity: 1; }
    .choice.correct { border-color: #16824b; background: #eaf7ef; }
    .choice.incorrect { border-color: #bd3d3d; background: #fff0f0; }
    #feedback {
      margin-top: 1rem;
      padding: .9rem 1rem;
      border-radius: .7rem;
      line-height: 1.5;
      background: #f1f5fb;
    }
    #feedback[hidden] { display: none; }
    #feedback h2 { margin: 0 0 .35rem; font-size: 1rem; }
    #feedback p { margin: 0; }
    .actions { margin-top: 1rem; display: flex; gap: .7rem; }
    .primary {
      border: 0;
      padding: .75rem 1rem;
      color: white;
      background: #244cad;
      font-weight: 650;
    }
    .primary:hover { background: #1c3d8d; }
    .primary:focus-visible { outline: 3px solid #91aaf0; outline-offset: 2px; }
    @media (max-width: 420px) {
      body { padding: .65rem; }
      main { border-radius: .8rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Potassium: where does it go?</h1>
    <p class="intro">Choose an answer to reveal feedback. This quiz uses only the study note provided.</p>
    <div id="quiz">
      <div class="count" id="count"></div>
      <p class="question" id="question"></p>
      <div class="choices" id="choices"></div>
      <section id="feedback" aria-live="polite" hidden>
        <h2 id="result"></h2>
        <p id="explanation"></p>
      </section>
      <div class="actions">
        <button class="primary" id="next" hidden>Next question</button>
        <button class="primary" id="retry" hidden>Retry quiz</button>
      </div>
    </div>
  </main>
  <script>
    const questions = [
      {
        prompt: "What does insulin do to potassium, according to the note?",
        options: [
          "Shifts potassium from blood into cells",
          "Removes potassium from the body in urine"
        ],
        answer: 0,
        explanation: "Insulin shifts potassium from blood into cells. This changes where potassium is, but insulin itself does not remove potassium from the body."
      },
      {
        prompt: "Which process removes potassium from the body?",
        options: [
          "Insulin shifting potassium into cells",
          "Urinary excretion"
        ],
        answer: 1,
        explanation: "Urinary excretion removes potassium from the body. Insulin shifts potassium from blood into cells without itself removing it."
      },
      {
        prompt: "After insulin shifts potassium from blood into cells, has potassium been removed from the body?",
        options: [
          "Yes, insulin removes it from the body",
          "No, insulin changes its location; urinary excretion removes it"
        ],
        answer: 1,
        explanation: "Insulin shifts potassium from blood into cells without itself removing potassium from the body. Urinary excretion is what removes potassium from the body."
      }
    ];

    let current = 0;
    const count = document.getElementById("count");
    const question = document.getElementById("question");
    const choices = document.getElementById("choices");
    const feedback = document.getElementById("feedback");
    const result = document.getElementById("result");
    const explanation = document.getElementById("explanation");
    const next = document.getElementById("next");
    const retry = document.getElementById("retry");

    function renderQuestion() {
      const item = questions[current];
      count.textContent = `Question ${current + 1} of ${questions.length}`;
      question.textContent = item.prompt;
      choices.replaceChildren();
      feedback.hidden = true;
      next.hidden = true;
      retry.hidden = true;

      item.options.forEach((label, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.textContent = label;
        button.addEventListener("click", () => choose(index));
        choices.append(button);
      });
    }

    function choose(index) {
      const item = questions[current];
      const buttons = choices.querySelectorAll("button");
      buttons.forEach((button, i) => {
        button.disabled = true;
        if (i === item.answer) button.classList.add("correct");
        else if (i === index) button.classList.add("incorrect");
      });
      const correct = index === item.answer;
      result.textContent = correct ? "Correct" : "Not quite";
      explanation.textContent = item.explanation;
      feedback.hidden = false;

      if (current < questions.length - 1) next.hidden = false;
      else retry.hidden = false;
    }

    next.addEventListener("click", () => {
      current += 1;
      renderQuestion();
      question.focus?.();
    });

    retry.addEventListener("click", () => {
      current = 0;
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
